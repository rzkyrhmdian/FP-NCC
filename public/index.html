<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FP-NCC Chat &amp; Polling</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer type="module" src="/app.js"></script>
  </head>

  <body>
    <header>
      <button
        type="button"
        id="menu-toggle"
        class="menu-toggle"
        aria-expanded="false"
        aria-controls="sidebar"
        aria-label="Buka daftar room dan pengguna"
      >
        Rooms &amp; Users
      </button>
      <h1>FP-NCC Chat</h1>
      <div id="header-room" class="header-room" aria-live="polite">#global</div>
    </header>

    <aside id="sidebar" aria-label="Daftar room dan pengguna">
      <div class="sidebar-header">
        <h2>Rooms</h2>
        <button
          type="button"
          id="close-sidebar-btn"
          class="close-sidebar-btn"
          aria-label="Tutup panel room dan pengguna"
        >
          &times;
        </button>
      </div>
      <ul id="rooms"></ul>

      <form id="room-form">
        <label for="room-name" class="sr-only">Nama room baru</label>
        <input type="text" id="room-name" placeholder="Nama room baru" required />
        <button type="submit" id="crt-room-btn" aria-label="Buat room baru">+</button>
      </form>

      <h2>Users online (<span id="user-count">0</span>)</h2>
      <ul id="users"></ul>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <main>
      <div id="connection-banner" class="connection-banner" role="alert" hidden></div>

      <section id="pinned-poll" aria-label="Polling aktif" aria-live="polite" hidden></section>

      <div id="conversation" role="log" aria-live="polite" aria-label="Riwayat percakapan"></div>

      <form id="form" class="composer-form">
        <label for="data" class="sr-only">Tulis pesan</label>
        <input
          type="text"
          id="data"
          placeholder="Tulis pesan untuk #global..."
          autocomplete="off"
          required
        />
        <div class="chat-controls">
          <button type="submit" id="send">Send</button>
          <button type="button" id="show-poll-btn">Create Poll</button>
        </div>
      </form>

      <div
        id="poll-section"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="poll-modal-title"
        hidden
      >
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="poll-modal-title">Buat Polling Baru</h2>
            <button
              type="button"
              id="close-poll-modal"
              class="close"
              aria-label="Tutup dialog buat polling"
            >
              &times;
            </button>
          </div>
          <form id="poll-form" class="poll-form">
            <div class="field-group">
              <label for="poll-question">Pertanyaan polling</label>
              <input
                type="text"
                id="poll-question"
                placeholder="Contoh: Makan siang di mana?"
                required
              />
            </div>
            <div class="field-group">
              <label for="poll-options">Opsi pilihan (pisahkan dengan koma)</label>
              <input
                type="text"
                id="poll-options"
                placeholder="Contoh: Soto, Bakso, Nasi Goreng"
                required
              />
            </div>
            <button type="submit" id="create-poll-btn">Create Poll</button>
          </form>
        </div>
      </div>
    </main>

    <template id="message">
      <article class="message-item">
        <div class="message-meta">
          <span class="message-author"></span>
          <time class="message-time"></time>
        </div>
        <p class="message-body"></p>
      </article>
    </template>
  </body>
</html>
